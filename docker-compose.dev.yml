services:
  auth-proxy:
    build:
      context: ./apps/auth-proxy
    ports:
      - "4316:4316"
    environment:
      PORT: "4316"
      COLLECTOR_BASE_URL: http://otel-collector:4318
      DATABASE_URL: postgresql://enrichment:enrichment@postgres:5432/enrichment
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:-local-development-secret-change-me}
      MAX_OTLP_BODY_SIZE: "10485760"
      LOG_REQUEST_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4316/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  telemetry-processor:
    build:
      context: .
      dockerfile: apps/telemetry-processor/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENRICHMENT_PG_DSN: host=postgres port=5432 dbname=enrichment user=enrichment password=enrichment
      ENRICHMENT_CH_URL: http://clickhouse:8123
      LOG_REQUEST_HEADERS: "true"
    depends_on:
      # healthy = initdb 스크립트(스키마+시드) 적용 완료 후 본 서버 기동.
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      # 제품별 bind mount를 따로 두면 빈 data 하위 디렉터리도 Compose가
      # 시작 시 생성하므로 file exporter가 부모 경로 부재로 실패하지 않는다.
      - ./data/codex:/data/codex
      - ./data/claude_code:/data/claude_code
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - telemetry-processor
    restart: unless-stopped

  # mock RDS — 조직/부서/사원 정보 소스(실 RDS 구축 전까지의 대역).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enrichment
      POSTGRES_PASSWORD: enrichment
      POSTGRES_DB: enrichment
    ports:
      - "55432:5432" # 호스트 디버그용(파이프라인은 컴포즈 네트워크의 postgres:5432 사용)
    volumes:
      # 최초 초기화 시 자동 적용(01→02 순). 볼륨이 없으므로 down 후 up 마다 재시드.
      - ./sql/rds/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/rds/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrichment -d enrichment"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # mock ClickHouse — enrichment 결과 적재 타깃(실 저장소 구축 전까지의 대역).
  # DDL 은 initdb 마운트가 아니라 processor 가 기동 시 멱등 적용한다
  # (init 임시 서버가 본 서버 포트 바인드와 레이스하는 이미지 플레이크 회피).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP 인터페이스(stdlib urllib 로 적재)
      - "9000:9000" # native(참고용)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 40
    restart: unless-stopped
