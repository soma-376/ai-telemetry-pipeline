# Enricher 로컬 인프라. RDS=Postgres(P3), 적재 타깃=ClickHouse(P7).
# 캐시된 이미지 태그 사용: postgres:16-alpine, clickhouse/clickhouse-server:24.8-alpine.
name: enricher

services:
  postgres:
    image: postgres:16-alpine
    container_name: enricher_pg
    environment:
      POSTGRES_USER: enricher
      POSTGRES_PASSWORD: enricher
      POSTGRES_DB: enricher
    ports:
      - "55432:5432"     # 호스트 디버그용(파이프라인은 컴포즈 네트워크의 postgres:5432 사용)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enricher -d enricher"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: enricher_ch
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"      # HTTP 인터페이스(stdlib urllib 로 적재)
      - "9000:9000"      # native(참고용)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 40
