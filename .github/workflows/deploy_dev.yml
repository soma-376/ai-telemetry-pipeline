name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 배포는 겹치면 안 된다. 진행 중인 배포를 취소하면 ECS 가 어중간한 상태로 남으므로
# cancel-in-progress 는 false 다. 뒤 커밋의 배포는 앞 배포가 끝난 뒤에 돈다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# 기본은 읽기만. OIDC 토큰 발급 권한(id-token)은 deploy 잡에만 준다.
permissions:
  contents: read

env:
  # AWS_REGION 은 공통 이름을 쓰고, 나머지는 _DEV 접미사가 붙은 GitHub Actions Secrets 를 등록해야 한다.
  AWS_REGION: ${{ secrets.AWS_REGION }}

  # infra 의 lib/dev/config.ts DEV_DEFAULT_IMAGE_TAG 와 반드시 일치해야 한다.
  # 태스크 정의가 이 태그를 가리키고, 강제 재배포가 같은 태그를 다시 당겨오는 구조다.
  IMAGE_TAG: ${{ secrets.IMAGE_TAG_DEV }}

  ECR_REPO_POST_PROCESSOR: ${{ secrets.ECR_REPO_POST_PROCESSOR_DEV }}
  ECR_REPO_AUTH_PROXY: ${{ secrets.ECR_REPO_AUTH_PROXY_DEV }}

  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_DEV }}
  ECS_SERVICE_COLLECTOR: ${{ secrets.ECS_SERVICE_COLLECTOR_DEV }}
  ECS_SERVICE_AUTH_PROXY: ${{ secrets.ECS_SERVICE_AUTH_PROXY_DEV }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/auth-proxy/package-lock.json

      # auth-proxy 에는 test 스크립트가 없다. typecheck + build 가 현재 유일한 게이트다.
      - name: Typecheck and build auth-proxy
        working-directory: apps/auth-proxy
        run: |
          npm ci
          npm run typecheck
          npm run build

  deploy:
    name: Build, push to ECR and force-deploy ECS
    needs: validate
    # 산출물이 linux/arm64 여야 한다(Fargate ARM64 / dev 는 t4g Graviton).
    # amd64 러너에서 QEMU 로 크로스빌드하면 몇 배 느리므로 네이티브 ARM 러너를 쓴다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      id-token: write # OIDC 로 AWS 역할을 가져오기 위해 필요
      contents: read
    steps:
      # 미등록 GitHub Secret 은 빈 문자열이 된다. 뒤 단계의 모호한 오류보다 먼저 명시적으로 잡는다.
      - name: Verify required GitHub Secrets
        run: |
          missing=()
          for mapping in \
            AWS_REGION:AWS_REGION \
            IMAGE_TAG:IMAGE_TAG_DEV \
            ECR_REPO_POST_PROCESSOR:ECR_REPO_POST_PROCESSOR_DEV \
            ECR_REPO_AUTH_PROXY:ECR_REPO_AUTH_PROXY_DEV \
            AWS_DEPLOY_ROLE_ARN:AWS_DEPLOY_ROLE_ARN_DEV \
            ECS_CLUSTER:ECS_CLUSTER_DEV \
            ECS_SERVICE_COLLECTOR:ECS_SERVICE_COLLECTOR_DEV \
            ECS_SERVICE_AUTH_PROXY:ECS_SERVICE_AUTH_PROXY_DEV; do
            env_name="${mapping%%:*}"
            secret_name="${mapping#*:}"
            if [[ -z "${!env_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::필수 GitHub Secret 이 등록되지 않았거나 비어 있다: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "배포 설정 확인 완료"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 장기 액세스 키를 쓰지 않는다(ADR-0024). 신뢰 정책이 sub 를 StringEquals 로 고정하므로
      # 이 잡에 environment: 를 붙이면 sub 가 바뀌어 AssumeRole 이 거부된다. 붙이지 마라.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # registry 출력으로 레지스트리 URI 를 얻는다. 덕분에 계정 ID 를 워크플로우에 적지 않는다.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # 컨텍스트가 레포 루트다. Dockerfile 이 sql/clickhouse/ 를 앱 디렉터리 밖에서 COPY 한다.
      # 캐시는 type=gha 만 쓴다 - 배포 역할에 ECR pull 권한이 없어 type=registry 는 AccessDenied 다.
      - name: Build and push post-processor
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/telemetry-processor/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_POST_PROCESSOR }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_POST_PROCESSOR }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=post-processor
          cache-to: type=gha,mode=max,scope=post-processor

      # 이쪽은 컨텍스트가 앱 디렉터리다. 위 스텝과 비대칭인 것이 정상이다.
      - name: Build and push auth-proxy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/auth-proxy
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_AUTH_PROXY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_AUTH_PROXY }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=auth-proxy
          cache-to: type=gha,mode=max,scope=auth-proxy

      # 태스크 정의는 CDK 가 소유한다(ADR-0009). 워크플로우는 새 리비전을 등록하지 않고
      # 기존 리비전을 그대로 재사용하는 강제 재배포만 건다. 그래서 이미지 태그가 가변이어야 한다.
      #
      # post-processor 는 독립 서비스가 아니라 collector 서비스 태스크 안의 컨테이너다.
      # 그래서 갱신 대상이 post-processor 가 아니라 collector 다.
      - name: Force new deployment
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_COLLECTOR" \
            --force-new-deployment --no-cli-pager --query 'service.serviceName' --output text
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_AUTH_PROXY" \
            --force-new-deployment --no-cli-pager --query 'service.serviceName' --output text

      # DescribeServices 는 권한 없는 서비스가 하나라도 섞이면 호출 전체가 거부된다.
      # 이 역할에 부여된 두 서비스만 넣는다.
      #
      # dev 서비스는 minHealthyPercent: 0 이라 재배포 중 짧은 다운타임이 정상이다. 무중단이 아니다.
      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE_COLLECTOR" "$ECS_SERVICE_AUTH_PROXY"
          echo "배포 완료: $ECS_SERVICE_COLLECTOR, $ECS_SERVICE_AUTH_PROXY"
